name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Release Build & Sign
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Check out Termux app modules
        uses: actions/checkout@v6
        with:
          repository: termux/termux-app
          path: termux-app

      - name: Patch Termux app modules for AGP 9
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path("termux-app").glob("*/build.gradle"):
              text = path.read_text()
              patched = text.replace(
                  "getDefaultProguardFile('proguard-android.txt')",
                  "getDefaultProguardFile('proguard-android-optimize.txt')",
              )
              if patched != text:
                  path.write_text(patched)
          PY

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '26'

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare build files
        env:
          SIGNING_CONFIG_SECRET: ${{ secrets.SIGNING_CONFIG }}
        run: |
          # 预检 Secrets
          if [ -z "${{ secrets.KEY_BASE64 }}" ]; then
            echo "❌ Error: KEY_BASE64 secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "❌ Error: SIGNING_CONFIG secret is missing!"
            exit 1
          fi

          # Decode base64-encoded keystore
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # 自动多渠道应用配置并修正路径
          python - <<'PY'
          import os
          from pathlib import Path

          files_to_create = [
              "local.properties", "signing.properties", "keystore.properties", "secret.properties",
              "app/local.properties", "app/signing.properties", "app/keystore.properties", "app/secret.properties"
          ]
          files_to_append = [
              "gradle.properties", "app/gradle.properties"
          ]

          # 从环境变量安全获取，避免 Shell 注入问题
          signing_config_text = os.getenv("SIGNING_CONFIG_SECRET", "")

          os.makedirs("app", exist_ok=True)

          # 写入配置文件
          for f in files_to_create:
              Path(f).write_text(signing_config_text + "\n")

          for f in files_to_append:
              p = Path(f)
              if p.exists():
                  content = p.read_text()
                  p.write_text(content + "\n" + signing_config_text + "\n")
              else:
                  p.write_text(signing_config_text + "\n")

          # 解析、修剪并生成环境变量字典
          env_vars = {}
          all_files = files_to_create + files_to_append

          for f in all_files:
              filepath = Path(f)
              if filepath.exists():
                  print(f"--- Processing {filepath} ---")
                  lines = filepath.read_text().splitlines()
                  patched_lines = []
                  for line in lines:
                      line_stripped = line.strip()
                      if not line_stripped or line_stripped.startswith("#"):
                          patched_lines.append(line)
                          continue
                      
                      idx_eq = line.find('=')
                      idx_col = line.find(':')
                      sep = None
                      if idx_eq != -1 and idx_col != -1:
                          sep = '=' if idx_eq < idx_col else ':'
                      elif idx_eq != -1:
                          sep = '='
                      elif idx_col != -1:
                          sep = ':'
                      
                      if sep:
                          parts = line.split(sep, 1)
                          key = parts[0].strip()
                          val = parts[1].strip()
                          
                          key_lower = key.lower()
                          val_lower = val.lower()
                          
                          is_path_prop = False
                          if (any(ext in val_lower for ext in [".jks", ".keystore", ".key", "app.key"]) 
                              or "/" in val or "\\" in val 
                              or "storefile" in key_lower or "keystore" in key_lower 
                              or "store_file" in key_lower or "key.store" in key_lower):
                              is_path_prop = True
                          
                          if is_path_prop:
                              abs_path = os.path.abspath("app/app.key")
                              patched_lines.append(f"{key}{sep}{abs_path}")
                              env_vars[key] = abs_path
                              env_vars[key.replace('.', '_').upper()] = abs_path
                              print(f"🔑 [PATH] {key} -> Patched to: {abs_path}")
                          else:
                              patched_lines.append(line)
                              env_vars[key] = val
                              env_vars[key.replace('.', '_').upper()] = val
                              print(f"🔑 [TEXT] {key} -> ***")
                      else:
                          patched_lines.append(line)
                  
                  filepath.write_text("\n".join(patched_lines) + "\n")

          # 将配置作为系统环境变量导出到 GITHUB_ENV，供后续 Gradle 读取
          github_env = os.getenv('GITHUB_ENV')
          if github_env:
              with open(github_env, 'a') as fe:
                  for k, v in env_vars.items():
                      fe.write(f"{k}={v}\n")
              print("✅ Exported signing variables to GITHUB_ENV successfully.")
          PY

          # Write Google Services config (if needed)
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (AppBundle)
        run: ./gradlew bundleRelease --no-daemon

      - name: Sign APK verification
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "✅ Signed APK found: $APK_PATH"
            $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK_PATH" || true
          else
            echo "⚠️ No signed APK found"
          fi

      - name: Extract version info
        id: version
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -1)
          if [ -n "$APK_PATH" ]; then
            VERSION_NAME=$($ANDROID_HOME/build-tools/*/aapt dump badging "$APK_PATH" | grep versionName | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            VERSION_CODE=$($ANDROID_HOME/build-tools/*/aapt dump badging "$APK_PATH" | grep versionCode | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
            echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
            echo "📦 Version: $VERSION_NAME ($VERSION_CODE)"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Generate changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "📋 Changes since $PREV_TAG:"
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges > CHANGELOG.md
          else
            echo "📋 Full changelog:"
            git log --pretty=format:"- %s (%h)" --no-merges -30 > CHANGELOG.md
          fi
          
          cat CHANGELOG.md
          echo "path=CHANGELOG.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: EterUee ${{ steps.version.outputs.name || github.ref_name }}
          body_path: ${{ steps.changelog.outputs.path || 'CHANGELOG.md' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
